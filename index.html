<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBank - Aplikacja w HTML</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.4s ease-out forwards; }
        .animate-pulse-slow { animation: pulseSlow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseSlow {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .dark .glass-effect {
            background: rgba(30, 41, 59, 0.85);
        }

        .cc-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #a5b4fc 100%);
        }
        .dark .cc-gradient {
            background: linear-gradient(135deg, #1e1b4b 0%, #3730a3 100%);
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="m-0 p-0 bg-slate-900 font-sans text-slate-900 antialiased overflow-hidden selection:bg-indigo-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, createContext, useContext } = React;

        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}"></i>`;
                    window.lucide.createIcons({
                        root: iconRef.current,
                        attrs: {
                            width: size,
                            height: size,
                            class: className
                        }
                    });
                }
            }, [name, size, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const MOCK_DATA = {
            user: {
                name: "Jan Kowalski",
                avatar: "JK",
                iban: "PL 42 9999 0000 1111 2222 3333 4444",
                balance: 12450.75,
                availableFunds: 13000.00,
                accountType: "Konto Osobiste Premium"
            },
            card: {
                number: "5432 1098 7654 3210",
                expiry: "12/28",
                cvv: "123",
                type: "Mastercard"
            },
            transactions: [
                { id: 1, date: "2026-10-02", title: "Żabka", amount: -24.50, type: "out", category: "Zakupy", iconName: "shopping-cart" },
                { id: 2, date: "2026-10-01", title: "Wypłata - Nova IT S.A.", amount: 8500.00, type: "in", category: "Wynagrodzenie", iconName: "banknote" },
                { id: 3, date: "2026-09-30", title: "Netflix", amount: -60.00, type: "out", category: "Rozrywka", iconName: "film" },
                { id: 4, date: "2026-09-29", title: "Orlen - Paliwo", amount: -250.00, type: "out", category: "Transport", iconName: "fuel" },
                { id: 5, date: "2026-09-28", title: "Przelew od: Anna Kowalska", amount: 150.00, type: "in", category: "Przelew", iconName: "arrow-down-left" },
                { id: 6, date: "2026-09-25", title: "Allegro", amount: -129.99, type: "out", category: "Zakupy", iconName: "shopping-bag" },
                { id: 7, date: "2026-09-20", title: "PGE - Prąd", amount: -145.20, type: "out", category: "Rachunki", iconName: "zap" },
            ]
        };

        const formatCurrency = (amount) => {
            return new Intl.NumberFormat('pl-PL', { style: 'currency', currency: 'PLN' }).format(amount);
        };

        const maskCard = (number, show) => {
            if (show) return number;
            return `•••• •••• •••• ${number.slice(-4)}`;
        };

        const maskIBAN = (iban) => {
            return `${iban.substring(0, 4)} •••• •••• •••• •••• •••• ${iban.slice(-4)}`;
        };

        const ToastContext = createContext();

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            
            const addToast = (message, type = 'success') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3000);
            };

            return (
                <ToastContext.Provider value={addToast}>
                    {children}
                    <div className="absolute top-4 left-0 right-0 z-[100] flex flex-col items-center pointer-events-none px-4 gap-2">
                        {toasts.map(toast => (
                            <div key={toast.id} className="animate-slide-up bg-slate-800 dark:bg-slate-700 text-white px-6 py-3 rounded-full shadow-lg flex items-center gap-2 text-sm font-medium w-full max-w-[320px]">
                                {toast.type === 'success' ? <Icon name="check-circle" className="text-green-400" size={18} /> : <Icon name="alert-circle" className="text-red-400" size={18} />}
                                {toast.message}
                            </div>
                        ))}
                    </div>
                </ToastContext.Provider>
            );
        };

        const LoginScreen = ({ onLogin }) => {
            const [pin, setPin] = useState('');
            const [error, setError] = useState(false);

            const handleNumberClick = (num) => {
                if (pin.length < 4) {
                    const newPin = pin + num;
                    setPin(newPin);
                    setError(false);
                    if (newPin.length === 4) {
                        setTimeout(() => {
                            onLogin(); 
                        }, 300);
                    }
                }
            };

            const handleBackspace = () => {
                setPin(pin.slice(0, -1));
                setError(false);
            };

            return (
                <div className="h-full w-full flex flex-col justify-between p-8 animate-fade-in cc-gradient text-white relative">
                    <div className="absolute inset-0 bg-black/20"></div>
                    
                    <div className="relative z-10 flex flex-col items-center mt-12">
                        <div className="w-20 h-20 bg-white/20 rounded-3xl flex items-center justify-center backdrop-blur-md mb-6 shadow-xl border border-white/30">
                            <Icon name="landmark" size={48} className="text-white" />
                        </div>
                        <h1 className="text-3xl font-bold mb-1 tracking-tight">NovaBank</h1>
                        <p className="text-white/80 text-sm mb-12">Fikcyjna aplikacja demo</p>
                        
                        <h2 className="text-xl font-medium mb-8">Wprowadź PIN</h2>
                        
                        <div className={`flex gap-4 mb-8 ${error ? 'animate-bounce' : ''}`}>
                            {[1, 2, 3, 4].map(i => (
                                <div key={i} className={`w-4 h-4 rounded-full border-2 border-white/50 transition-all duration-200 ${pin.length >= i ? 'bg-white border-white scale-110' : ''}`}></div>
                            ))}
                        </div>
                        <p className="text-white/60 text-xs">Wpisz dowolny 4-cyfrowy PIN</p>
                    </div>

                    <div className="relative z-10 grid grid-cols-3 gap-y-6 gap-x-8 max-w-[280px] mx-auto mb-10">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                            <button key={num} onClick={() => handleNumberClick(num.toString())} className="w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 backdrop-blur-sm transition-colors">
                                {num}
                            </button>
                        ))}
                        <div></div>
                        <button onClick={() => handleNumberClick('0')} className="w-16 h-16 rounded-full flex items-center justify-center text-2xl font-medium bg-white/10 hover:bg-white/20 active:bg-white/30 backdrop-blur-sm transition-colors">
                            0
                        </button>
                        <button onClick={handleBackspace} className="w-16 h-16 rounded-full flex items-center justify-center text-2xl bg-white/5 hover:bg-white/10 active:bg-white/20 transition-colors">
                            <Icon name="delete" size={28} />
                        </button>
                    </div>
                </div>
            );
        };

        const TopBar = ({ title, user, isDarkMode, toggleTheme, showBack, onBack, onLogout }) => (
            <div className="absolute top-0 w-full z-40 glass-effect border-b border-gray-200 dark:border-gray-800 px-4 h-16 flex items-center justify-between transition-colors duration-300">
                {showBack ? (
                    <button onClick={onBack} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <Icon name="chevron-left" size={24} />
                    </button>
                ) : (
                    <div className="flex items-center gap-3">
                        <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold shadow-md cursor-pointer" onClick={() => onBack('profile')}>
                            {user.avatar}
                        </div>
                        <div>
                            <p className="text-xs text-slate-500 dark:text-slate-400 font-medium">Cześć,</p>
                            <p className="text-sm font-bold leading-tight">{user.name.split(' ')[0]}</p>
                        </div>
                    </div>
                )}
                
                <div className="text-lg font-bold absolute left-1/2 -translate-x-1/2 dark:text-white">{title}</div>
                
                <div className="flex gap-2">
                    <button onClick={toggleTheme} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        <Icon name={isDarkMode ? "sun" : "moon"} size={20} className={isDarkMode ? "text-yellow-400" : "text-indigo-600"} />
                    </button>
                    {!showBack && (
                        <button className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 relative hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                            <Icon name="bell" size={20} />
                            <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border border-white dark:border-slate-800 animate-pulse"></span>
                        </button>
                    )}
                    {showBack && title === 'Profil' && (
                         <button onClick={onLogout} className="w-10 h-10 flex items-center justify-center rounded-full bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 hover:bg-red-100 transition-colors">
                            <Icon name="log-out" size={20} />
                        </button>
                    )}
                </div>
            </div>
        );

        const BottomNav = ({ activeTab, setActiveTab }) => {
            const navItems = [
                { id: 'home', iconName: 'home', label: 'Start' },
                { id: 'account', iconName: 'list', label: 'Historia' },
                { id: 'card', iconName: 'credit-card', label: 'Karty' },
                { id: 'transfers', iconName: 'arrow-right-left', label: 'Przelewy' },
            ];

            return (
                <div className="absolute bottom-0 w-full z-40 glass-effect border-t border-gray-200 dark:border-gray-800 px-2 pb-5 pt-3 sm:pb-3 flex justify-between transition-colors duration-300">
                    {navItems.map(item => {
                        const isActive = activeTab === item.id;
                        return (
                            <button key={item.id} onClick={() => setActiveTab(item.id)} className={`flex-1 flex flex-col items-center justify-center gap-1 transition-all duration-300 ${isActive ? 'text-indigo-600 dark:text-indigo-400 scale-110' : 'text-slate-500 hover:text-slate-900 dark:hover:text-slate-300'}`}>
                                <Icon name={item.iconName} size={24} className={isActive ? 'fill-current' : ''} />
                                <span className={`text-[10px] font-medium ${isActive ? 'opacity-100' : 'opacity-70'}`}>{item.label}</span>
                            </button>
                        );
                    })}
                </div>
            );
        };

        const HomeScreen = ({ user, transactions, onNavigate, onShowBlik, onAddMoney }) => {
            const [showBalance, setShowBalance] = useState(true);
            const [clickCount, setClickCount] = useState(0);
            const [showAddMoney, setShowAddMoney] = useState(false);
            const [addAmount, setAddAmount] = useState('');
            const addToast = useContext(ToastContext);

            const handleSecretClick = () => {
                const newCount = clickCount + 1;
                setClickCount(newCount);
                if (newCount >= 5) {
                    setShowAddMoney(true);
                    setClickCount(0);
                }
            };

            const handleAdd = () => {
                const amt = parseFloat(addAmount);
                if (!isNaN(amt) && amt > 0) {
                    onAddMoney(amt);
                    addToast(`Dodano ${formatCurrency(amt)}!`);
                    setShowAddMoney(false);
                    setAddAmount('');
                }
            };

            return (
                <div className="animate-slide-up space-y-6">
                    {showAddMoney && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[32px] p-6 shadow-2xl relative animate-slide-up">
                                <button onClick={() => setShowAddMoney(false)} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 hover:bg-slate-200">
                                    <Icon name="x" size={20} />
                                </button>
                                <h2 className="text-xl font-bold mb-4 text-slate-900 dark:text-white">Dodaj środki (Dev)</h2>
                                <input 
                                    type="number" 
                                    value={addAmount} 
                                    onChange={(e) => setAddAmount(e.target.value)} 
                                    placeholder="Kwota doładowania" 
                                    className="w-full bg-slate-50 dark:bg-slate-700 border-none rounded-xl p-3 mb-4 text-lg focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white" 
                                />
                                <button onClick={handleAdd} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-3 transition-colors shadow-lg">
                                    Zatwierdź
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 relative overflow-hidden">
                        <div className="absolute -right-10 -top-10 w-40 h-40 bg-indigo-500/10 rounded-full blur-2xl"></div>
                        <div className="flex justify-between items-center mb-2 relative z-10">
                            <span onClick={handleSecretClick} className="text-slate-500 dark:text-slate-400 text-sm font-medium cursor-pointer select-none">Dostępne środki</span>
                            <button onClick={() => setShowBalance(!showBalance)} className="text-slate-400 hover:text-indigo-600 transition-colors">
                                <Icon name={showBalance ? "eye" : "eye-off"} size={20} />
                            </button>
                        </div>
                        <div className="text-4xl font-bold text-slate-900 dark:text-white mb-1 relative z-10 tracking-tight">
                            {showBalance ? formatCurrency(user.balance) : '••••,•• PLN'}
                        </div>
                        <div className="text-sm text-slate-500 dark:text-slate-400 relative z-10">
                            Saldo księgowe: {showBalance ? formatCurrency(user.balance) : '••••,•• PLN'}
                        </div>
                    </div>

                    <div className="grid grid-cols-4 gap-3">
                        {[
                            { id: 'transfer', iconName: 'send', label: 'Przelew', color: 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400', action: () => onNavigate('transfers') },
                            { id: 'blik', iconName: 'qr-code', label: 'BLIK', color: 'bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400', action: onShowBlik },
                            { id: 'deposit', iconName: 'download', label: 'Wpłać', color: 'bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400', action: () => onNavigate('transfers') },
                            { id: 'withdraw', iconName: 'upload', label: 'Wypłać', color: 'bg-orange-50 dark:bg-orange-900/30 text-orange-600 dark:text-orange-400', action: () => onNavigate('transfers') },
                        ].map(btn => (
                            <button key={btn.id} onClick={btn.action} className="flex flex-col items-center gap-2 group">
                                <div className={`w-14 h-14 rounded-2xl flex items-center justify-center text-2xl ${btn.color} group-hover:scale-95 transition-transform shadow-sm`}>
                                    <Icon name={btn.iconName} size={26} />
                                </div>
                                <span className="text-xs font-medium text-slate-700 dark:text-slate-300">{btn.label}</span>
                            </button>
                        ))}
                    </div>

                    <div className="mt-4" onClick={() => onNavigate('card')}>
                        <div className="flex justify-between items-end mb-3 px-1">
                            <h3 className="font-semibold text-slate-800 dark:text-slate-100">Twoja Karta</h3>
                            <button className="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Szczegóły</button>
                        </div>
                        <div className="cc-gradient rounded-3xl p-5 text-white shadow-lg relative overflow-hidden cursor-pointer transform hover:scale-[1.02] transition-transform">
                            <Icon name="nfc" size={32} className="absolute right-5 top-5 opacity-70 transform rotate-90" />
                            <p className="text-sm opacity-80 mb-6 font-medium">Mastercard</p>
                            <p className="text-xl tracking-widest font-mono mb-3">•••• •••• •••• {MOCK_DATA.card.number.slice(-4)}</p>
                            <div className="flex justify-between items-center text-xs opacity-90 font-medium">
                                <span>{user.name}</span>
                                <span>{MOCK_DATA.card.expiry}</span>
                            </div>
                        </div>
                    </div>

                    <div>
                        <div className="flex justify-between items-end mb-4 px-1 mt-6">
                            <h3 className="font-semibold text-slate-800 dark:text-slate-100">Ostatnie operacje</h3>
                            <button onClick={() => onNavigate('account')} className="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Wszystkie</button>
                        </div>
                        <div className="bg-white dark:bg-slate-800 rounded-3xl p-4 shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">
                            {transactions.slice(0, 3).map(tx => (
                                <div key={tx.id} className="flex items-center justify-between group cursor-pointer">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-full bg-slate-50 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-300 group-hover:bg-indigo-50 dark:group-hover:bg-indigo-900/30 group-hover:text-indigo-600 transition-colors">
                                            <Icon name={tx.iconName} size={20} />
                                        </div>
                                        <div>
                                            <p className="text-sm font-semibold text-slate-800 dark:text-slate-200 line-clamp-1">{tx.title}</p>
                                            <p className="text-xs text-slate-500 dark:text-slate-400">{tx.category} • {tx.date}</p>
                                        </div>
                                    </div>
                                    <span className={`font-semibold text-sm ${tx.amount > 0 ? 'text-green-500' : 'text-slate-800 dark:text-slate-200'}`}>
                                        {tx.amount > 0 ? '+' : ''}{formatCurrency(tx.amount)}
                                    </span>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const AccountScreen = ({ user, transactions }) => {
            const [filter, setFilter] = useState('all');
            const addToast = useContext(ToastContext);

            const filteredTx = transactions.filter(tx => {
                if (filter === 'in') return tx.amount > 0;
                if (filter === 'out') return tx.amount < 0;
                return true;
            });

            const copyIban = () => {
                navigator.clipboard.writeText(user.iban.replace(/\s/g, '')).then(() => {
                    addToast('Skopiowano numer rachunku!');
                }).catch(() => {
                    addToast('Skopiowano numer rachunku! (fallback)');
                });
            };

            return (
                <div className="animate-slide-up space-y-6">
                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                        <div className="flex justify-between items-start mb-4">
                            <div>
                                <h2 className="text-lg font-bold dark:text-white">{user.accountType}</h2>
                                <p className="text-sm text-slate-500">{user.name}</p>
                            </div>
                            <div className="w-10 h-10 rounded-full bg-indigo-50 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600">
                                <Icon name="wallet" size={20} />
                            </div>
                        </div>
                        
                        <div className="bg-slate-50 dark:bg-slate-700/50 rounded-2xl p-4 flex justify-between items-center mb-4">
                            <div>
                                <p className="text-xs text-slate-500 mb-1">Numer rachunku IBAN</p>
                                <p className="text-sm font-mono tracking-tight text-slate-700 dark:text-slate-300">{maskIBAN(user.iban)}</p>
                            </div>
                            <button onClick={copyIban} className="p-2 bg-white dark:bg-slate-600 rounded-full shadow-sm hover:bg-slate-100 dark:hover:bg-slate-500 transition-colors text-indigo-600 dark:text-indigo-400">
                                <Icon name="copy" size={18} />
                            </button>
                        </div>
                    </div>

                    <div>
                        <h3 className="font-semibold text-slate-800 dark:text-slate-100 mb-4 px-1">Historia transakcji</h3>
                        
                        <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar px-1 pb-1">
                            {[
                                { id: 'all', label: 'Wszystkie' },
                                { id: 'in', label: 'Wpływy' },
                                { id: 'out', label: 'Wydatki' }
                            ].map(f => (
                                <button key={f.id} onClick={() => setFilter(f.id)} 
                                    className={`px-5 py-2 rounded-full text-sm font-medium transition-colors whitespace-nowrap ${filter === f.id ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-md' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50'}`}>
                                    {f.label}
                                </button>
                            ))}
                        </div>

                        <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 p-2">
                            {filteredTx.length > 0 ? filteredTx.map((tx, idx) => (
                                <div key={tx.id} className={`flex items-center justify-between p-4 ${idx !== filteredTx.length - 1 ? 'border-b border-slate-100 dark:border-slate-700' : ''} hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors rounded-2xl`}>
                                    <div className="flex items-center gap-4">
                                        <div className="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-500 dark:text-slate-400">
                                            <Icon name={tx.iconName} size={20} />
                                        </div>
                                        <div>
                                            <p className="text-sm font-semibold text-slate-800 dark:text-slate-200">{tx.title}</p>
                                            <p className="text-xs text-slate-500">{tx.date}</p>
                                        </div>
                                    </div>
                                    <span className={`font-semibold text-sm ${tx.amount > 0 ? 'text-green-500' : 'text-slate-800 dark:text-slate-200'}`}>
                                        {tx.amount > 0 ? '+' : ''}{formatCurrency(tx.amount)}
                                    </span>
                                </div>
                            )) : (
                                <div className="p-8 text-center text-slate-500">Brak transakcji dla tego filtru.</div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const CardScreen = ({ card }) => {
            const [showDetails, setShowDetails] = useState(false);
            const [isLocked, setIsLocked] = useState(false);
            const [limit, setLimit] = useState(2500);
            const addToast = useContext(ToastContext);

            const handleLockToggle = () => {
                setIsLocked(!isLocked);
                addToast(isLocked ? 'Karta została odblokowana' : 'Karta została zablokowana', isLocked ? 'success' : 'warning');
            };

            return (
                <div className="animate-slide-up space-y-6">
                    <div className="relative w-full" style={{ perspective: '1000px' }}>
                        <div className={`w-full h-56 rounded-[24px] p-6 text-white shadow-xl transition-all duration-700 relative overflow-hidden ${isLocked ? 'bg-slate-600 dark:bg-slate-800' : 'cc-gradient'}`}>
                            
                            {isLocked && (
                                <div className="absolute inset-0 bg-black/40 flex items-center justify-center z-20 backdrop-blur-[2px]">
                                    <div className="bg-red-500 text-white px-4 py-2 rounded-full font-bold flex items-center gap-2 shadow-lg">
                                        <Icon name="lock" size={18} /> ZABLOKOWANA
                                    </div>
                                </div>
                            )}

                            <div className="flex justify-between items-start relative z-10">
                                <div className="text-xl font-bold italic tracking-wider">NovaBank</div>
                                <Icon name="nfc" size={28} className="opacity-80 transform rotate-90" />
                            </div>
                            
                            <div className="mt-8 mb-6 relative z-10">
                                <p className="text-2xl font-mono tracking-widest drop-shadow-md">
                                    {showDetails ? card.number : maskCard(card.number, false)}
                                </p>
                            </div>
                            
                            <div className="flex justify-between items-end text-sm relative z-10 font-medium opacity-90">
                                <div>
                                    <p className="text-[10px] uppercase opacity-70 mb-1">Posiadacz</p>
                                    <p>{MOCK_DATA.user.name}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] uppercase opacity-70 mb-1">Ważna do</p>
                                    <p>{showDetails ? card.expiry : '••/••'}</p>
                                </div>
                                <div>
                                    <p className="text-[10px] uppercase opacity-70 mb-1">CVV</p>
                                    <p className="font-mono">{showDetails ? card.cvv : '•••'}</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-4 shadow-sm border border-slate-100 dark:border-slate-700 grid grid-cols-2 gap-4">
                        <button onClick={() => setShowDetails(!showDetails)} disabled={isLocked} className="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors disabled:opacity-50">
                            <div className="w-12 h-12 rounded-full bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 flex items-center justify-center text-xl">
                                <Icon name={showDetails ? "eye-off" : "eye"} size={24} />
                            </div>
                            <span className="text-sm font-medium dark:text-slate-200">{showDetails ? 'Ukryj dane' : 'Pokaż dane'}</span>
                        </button>
                        
                        <button onClick={handleLockToggle} className="flex flex-col items-center gap-2 p-3 rounded-2xl hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                            <div className={`w-12 h-12 rounded-full flex items-center justify-center text-xl ${isLocked ? 'bg-red-100 text-red-600 dark:bg-red-900/40 dark:text-red-400' : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300'}`}>
                                <Icon name={isLocked ? "lock" : "unlock"} size={24} />
                            </div>
                            <span className="text-sm font-medium dark:text-slate-200">{isLocked ? 'Odblokuj' : 'Zablokuj czasowo'}</span>
                        </button>
                    </div>

                    <div className="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700">
                        <h3 className="font-semibold mb-4 dark:text-white">Ustawienia limitów (Dzienny)</h3>
                        
                        <div className="mb-2 flex justify-between items-center">
                            <span className="text-sm text-slate-600 dark:text-slate-400 flex items-center gap-2">
                                <Icon name="shopping-bag" size={16} /> Płatności w sklepie
                            </span>
                            <span className="font-bold dark:text-white">{formatCurrency(limit)}</span>
                        </div>
                        <input type="range" min="0" max="10000" step="100" value={limit} onChange={(e) => setLimit(e.target.value)} disabled={isLocked}
                            className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer dark:bg-slate-700 accent-indigo-600 disabled:opacity-50" />
                        
                        <div className="flex justify-between text-xs text-slate-400 mt-2">
                            <span>0 PLN</span>
                            <span>10 000 PLN</span>
                        </div>
                    </div>
                </div>
            );
        };

        const TransfersScreen = ({ onShowBlik }) => {
            const [transferType, setTransferType] = useState('domestic');
            const [amount, setAmount] = useState('');
            const addToast = useContext(ToastContext);

            const handleTransfer = (e) => {
                e.preventDefault();
                if(!amount || amount <= 0) return;
                addToast(`Zlecono przelew na kwotę ${formatCurrency(amount)}`);
                setAmount('');
            };

            return (
                <div className="animate-slide-up space-y-6">
                    <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-2xl">
                        <button onClick={() => setTransferType('domestic')} className={`flex-1 py-2 text-sm font-medium rounded-xl transition-colors ${transferType === 'domestic' ? 'bg-white dark:bg-slate-600 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}`}>Krajowy</button>
                        <button onClick={() => setTransferType('own')} className={`flex-1 py-2 text-sm font-medium rounded-xl transition-colors ${transferType === 'own' ? 'bg-white dark:bg-slate-600 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}`}>Własny</button>
                        <button onClick={() => setTransferType('phone')} className={`flex-1 py-2 text-sm font-medium rounded-xl transition-colors ${transferType === 'phone' ? 'bg-white dark:bg-slate-600 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}`}>Na telefon</button>
                    </div>

                    <form onSubmit={handleTransfer} className="bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-sm border border-slate-100 dark:border-slate-700 space-y-5">
                        
                        {transferType === 'domestic' && (
                            <>
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">Nazwa odbiorcy</label>
                                    <input type="text" placeholder="np. Jan Kowalski" required className="w-full bg-slate-50 dark:bg-slate-700 border-none rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white" />
                                </div>
                                <div>
                                    <label className="block text-xs font-medium text-slate-500 mb-1">Numer konta (IBAN)</label>
                                    <input type="text" placeholder="PL __ ____ ____ ____ ____ ____ ____" required className="w-full bg-slate-50 dark:bg-slate-700 border-none rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none font-mono text-sm text-slate-900 dark:text-white" />
                                </div>
                            </>
                        )}

                        {transferType === 'own' && (
                            <div>
                                <label className="block text-xs font-medium text-slate-500 mb-1">Wybierz rachunek docelowy</label>
                                <select className="w-full bg-slate-50 dark:bg-slate-700 border-none rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white">
                                    <option>Konto Oszczędnościowe (3 500,00 PLN)</option>
                                    <option>Konto Walutowe EUR (150,00 EUR)</option>
                                </select>
                            </div>
                        )}

                        {transferType === 'phone' && (
                            <div>
                                <label className="block text-xs font-medium text-slate-500 mb-1">Numer telefonu odbiorcy BLIK</label>
                                <div className="flex gap-2">
                                    <div className="bg-slate-50 dark:bg-slate-700 rounded-xl p-3 flex items-center justify-center text-slate-500 font-medium w-16">+48</div>
                                    <input type="tel" placeholder="___ ___ ___" required className="flex-1 bg-slate-50 dark:bg-slate-700 border-none rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white font-mono" />
                                </div>
                            </div>
                        )}

                        <div>
                            <label className="block text-xs font-medium text-slate-500 mb-1">Tytuł przelewu</label>
                            <input type="text" placeholder="Tytuł" defaultValue={transferType === 'own' ? 'Przelew własny' : ''} required className="w-full bg-slate-50 dark:bg-slate-700 border-none rounded-xl p-3 focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white" />
                        </div>

                        <div>
                            <label className="block text-xs font-medium text-slate-500 mb-1">Kwota (PLN)</label>
                            <div className="relative">
                                <input type="number" value={amount} onChange={(e)=>setAmount(e.target.value)} placeholder="0.00" step="0.01" min="0.01" required 
                                    className="w-full bg-slate-50 dark:bg-slate-700 border-none rounded-xl p-3 pl-4 pr-12 text-2xl font-bold focus:ring-2 focus:ring-indigo-500 outline-none text-slate-900 dark:text-white" />
                                <span className="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 font-medium">PLN</span>
                            </div>
                        </div>

                        <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl py-4 transition-colors shadow-lg shadow-indigo-500/30">
                            Wyślij przelew
                        </button>
                    </form>

                    <div className="bg-gradient-to-r from-red-600 to-red-500 rounded-3xl p-6 text-white flex items-center justify-between shadow-md cursor-pointer hover:shadow-lg transition-all" onClick={onShowBlik}>
                        <div>
                            <h3 className="font-bold text-lg mb-1">Płatność BLIK</h3>
                            <p className="text-sm opacity-90">Wygeneruj kod by zapłacić w sklepie</p>
                        </div>
                        <div className="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center backdrop-blur-sm">
                            <Icon name="qr-code" size={24} className="text-white" />
                        </div>
                    </div>
                </div>
            );
        };

        const ProfileScreen = ({ user, toggleFullscreen, isFullscreen }) => {
            const addToast = useContext(ToastContext);

            // Dodano nowy element do ustawień - włącznik trybu pełnoekranowego
            const settings = [
                { 
                    iconName: isFullscreen ? 'minimize' : 'maximize', 
                    title: 'Pełny ekran', 
                    desc: isFullscreen ? 'Wyłącz tryb pełnoekranowy' : 'Włącz tryb pełnoekranowy',
                    action: toggleFullscreen 
                },
                { iconName: 'shield-check', title: 'Bezpieczeństwo', desc: 'PIN, biometria, urządzenia' },
                { iconName: 'bell-ring', title: 'Powiadomienia', desc: 'Push, SMS, e-mail' },
                { iconName: 'sliders', title: 'Ustawienia aplikacji', desc: 'Język, limity ogólne' },
                { iconName: 'headphones', title: 'Pomoc i kontakt', desc: 'Czat, infolinia' },
                { iconName: 'info', title: 'O aplikacji', desc: 'Wersja demo NovaBank v2.0' },
            ];

            return (
                <div className="animate-slide-up space-y-6">
                    <div className="flex flex-col items-center mt-4 mb-8">
                        <div className="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold shadow-lg text-3xl mb-4">
                            {user.avatar}
                        </div>
                        <h2 className="text-2xl font-bold dark:text-white">{user.name}</h2>
                        <p className="text-slate-500">Użytkownik Premium</p>
                    </div>

                    <div className="bg-white dark:bg-slate-800 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
                        {settings.map((item, idx) => (
                            <div key={idx} onClick={() => item.action ? item.action() : addToast('Funkcja niedostępna w wersji demo')} className={`flex items-center gap-4 p-4 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors ${idx !== settings.length -1 ? 'border-b border-slate-100 dark:border-slate-700' : ''}`}>
                                <div className="w-10 h-10 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
                                    <Icon name={item.iconName} size={20} />
                                </div>
                                <div className="flex-1">
                                    <h4 className="font-semibold text-slate-800 dark:text-slate-200 text-sm">{item.title}</h4>
                                    <p className="text-xs text-slate-500">{item.desc}</p>
                                </div>
                                <Icon name="chevron-right" size={18} className="text-slate-400" />
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const BlikModal = ({ onClose }) => {
            const [code, setCode] = useState('');
            const [progress, setProgress] = useState(100);

            useEffect(() => {
                const generateCode = () => {
                    const c = Math.floor(100000 + Math.random() * 900000).toString();
                    setCode(`${c.substring(0,3)} ${c.substring(3,6)}`);
                    setProgress(100);
                };
                generateCode();

                const timer = setInterval(() => {
                    setProgress(p => {
                        if (p <= 0) {
                            generateCode();
                            return 100;
                        }
                        return p - (100 / 120); 
                    });
                }, 1000);

                return () => clearInterval(timer);
            }, []);

            return (
                <div className="absolute inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
                    <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-[32px] p-8 shadow-2xl relative animate-slide-up">
                        <button onClick={onClose} className="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 hover:bg-slate-200">
                            <Icon name="x" size={20} />
                        </button>
                        
                        <div className="text-center mt-2">
                            <div className="w-16 h-16 bg-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-red-600/30">
                                <Icon name="qr-code" size={32} className="text-white" />
                            </div>
                            <h2 className="text-lg font-bold mb-1 text-slate-900 dark:text-white">Kod BLIK</h2>
                            <p className="text-sm text-slate-500 mb-6">Wpisz kod w terminalu lub internecie</p>
                            
                            <div className="text-4xl font-mono font-bold tracking-widest text-slate-900 dark:text-white mb-6">
                                {code || '--- ---'}
                            </div>
                            
                            <div className="w-full bg-slate-200 dark:bg-slate-700 h-2 rounded-full overflow-hidden mb-2">
                                <div className="bg-red-500 h-full transition-all duration-1000 ease-linear" style={{ width: `${progress}%` }}></div>
                            </div>
                            <p className="text-xs text-slate-400">Kod wygaśnie za chwilę</p>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [isDarkMode, setIsDarkMode] = useState(false);
            const [showBlik, setShowBlik] = useState(false);
            const [isFullscreen, setIsFullscreen] = useState(false);
            
            const [userData, setUserData] = useState(MOCK_DATA.user);
            const [transactionsData, setTransactionsData] = useState(MOCK_DATA.transactions);
            
            const contentRef = useRef(null);

            useEffect(() => {
                const handleFullscreenChange = () => {
                    setIsFullscreen(!!document.fullscreenElement);
                };
                document.addEventListener('fullscreenchange', handleFullscreenChange);
                return () => document.removeEventListener('fullscreenchange', handleFullscreenChange);
            }, []);

            useEffect(() => {
                if (contentRef.current) {
                    contentRef.current.scrollTo({ top: 0, behavior: 'smooth' });
                }
            }, [activeTab]);

            const toggleTheme = () => setIsDarkMode(!isDarkMode);
            
            const toggleFullscreen = () => {
                try {
                    // Sprawdzamy czy przeglądarka w ogóle zezwala na fullscreen w obecnym kontekście
                    if (!document.fullscreenEnabled) {
                        console.warn("Tryb pełnoekranowy jest zablokowany przez uprawnienia przeglądarki (permissions policy).");
                        return;
                    }

                    if (!document.fullscreenElement) {
                        const promise = document.documentElement.requestFullscreen();
                        if (promise && typeof promise.catch === 'function') {
                            promise.catch(e => console.warn("Fullscreen odrzucony:", e));
                        }
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        }
                    }
                } catch (error) {
                    console.warn("Wystąpił błąd trybu pełnoekranowego:", error);
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setActiveTab('home');
            };

            const handleAddMoney = (amount) => {
                setUserData(prev => ({
                    ...prev,
                    balance: prev.balance + amount,
                    availableFunds: prev.availableFunds + amount
                }));
                
                const newTx = {
                    id: Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    title: "Wpłata własna (System)",
                    amount: amount,
                    type: "in",
                    category: "Inne",
                    iconName: "plus-circle"
                };
                
                setTransactionsData(prev => [newTx, ...prev]);
            };

            const getScreenTitle = () => {
                switch(activeTab) {
                    case 'home': return 'Pulpit';
                    case 'account': return 'Historia';
                    case 'card': return 'Twoje Karty';
                    case 'transfers': return 'Przelewy';
                    case 'profile': return 'Profil';
                    default: return '';
                }
            };

            return (
                <div className={isDarkMode ? 'dark' : ''}>
                    <div className="min-h-screen flex items-center justify-center p-0">
                        <div className="w-full h-screen overflow-hidden relative bg-slate-50 dark:bg-slate-900 flex flex-col transition-colors duration-300">
                            <ToastProvider>
                                {!isLoggedIn ? (
                                    <LoginScreen onLogin={() => setIsLoggedIn(true)} />
                                ) : (
                                    <>
                                        <TopBar 
                                            title={getScreenTitle()} 
                                            user={userData} 
                                            isDarkMode={isDarkMode} 
                                            toggleTheme={toggleTheme}
                                            showBack={activeTab !== 'home'}
                                            onBack={(tab) => typeof tab === 'string' ? setActiveTab(tab) : setActiveTab('home')}
                                            onLogout={handleLogout}
                                        />
                                        
                                        <main ref={contentRef} className="flex-1 overflow-y-auto no-scrollbar pt-20 pb-28 px-4 relative z-10">
                                            {activeTab === 'home' && <HomeScreen user={userData} transactions={transactionsData} onNavigate={setActiveTab} onShowBlik={() => setShowBlik(true)} onAddMoney={handleAddMoney} />}
                                            {activeTab === 'account' && <AccountScreen user={userData} transactions={transactionsData} />}
                                            {activeTab === 'card' && <CardScreen card={MOCK_DATA.card} />}
                                            {activeTab === 'transfers' && <TransfersScreen onShowBlik={() => setShowBlik(true)} />}
                                            {activeTab === 'profile' && <ProfileScreen user={userData} toggleFullscreen={toggleFullscreen} isFullscreen={isFullscreen} />}
                                        </main>

                                        <BottomNav activeTab={activeTab} setActiveTab={setActiveTab} />
                                        
                                        {showBlik && <BlikModal onClose={() => setShowBlik(false)} />}
                                    </>
                                )}
                            </ToastProvider>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
